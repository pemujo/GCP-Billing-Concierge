[project]
name = "gcp-billing-concierge"
version = "0.2.0"
description = "FinOps GCP Billing Concierge agent powered by Gemini and Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.28.1",
    "google-agents-cli>=0.1.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-logging>=3.14.0",
    "google-cloud-monitoring>=2.26.0",
    "google-cloud-scheduler>=2.19.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-iam>=2.15.0",
    "google-cloud-resource-manager>=1.12.0",
    "google-cloud-aiplatform[agent-engines]>=1.130.0",
    "google-cloud-bigquery-storage>=2.27.0",
    "google-cloud-dataplex>=1.7.0",
    "pyarrow>=14.0.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.15.10",
    "tzlocal>=5.3.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["GCP_billing_concierge"]

[tool.agents-cli]
name = "gcp-billing-concierge"
description = "FinOps GCP Billing Concierge agent powered by Gemini and Google ADK"
base_template = "adk"
agent_directory = "GCP_billing_concierge"

[tool.agents-cli.create_params]
deployment_target = "agent_runtime"
session_type = "none"
cicd_runner = "skip"
include_data_ingestion = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
